<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Privacy Policy — OpenTomato</title>
    <meta name="description" content="OpenTomato's privacy policy: what data it collects (none) and how it works." />
    <link rel="icon" href="assets/logo.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="assets/style.css" />
    <script src="assets/theme.js"></script>
    <script src="assets/config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/lib/marked.umd.min.js"></script>
  </head>
  <body>
    <nav class="site-nav">
      <div class="container nav-inner">
        <a href="index.html" class="brand">
          <img src="assets/logo.svg" alt="" />
          OpenTomato
        </a>
        <div class="nav-links">
          <a href="index.html#features">Features</a>
          <a href="index.html#how-it-works">How it works</a>
          <a href="app.html">Demo</a>
          <a href="privacy.html">Privacy</a>
          <a href="https://github.com/cksarge/OpenTomato" target="_blank" rel="noopener">GitHub</a>
          <button id="theme-toggle-btn" class="icon-btn" title="Toggle theme" aria-label="Toggle theme"></button>
          <!-- URL filled in from assets/config.js once OpenTomato is on the Web Store -->
          <a href="#" data-store-link class="btn btn-primary">Add to Chrome</a>
        </div>
      </div>
    </nav>

    <main class="policy-page container">
      <div class="policy-card">
        <div id="policy-content">
          <p class="policy-loading">Loading privacy policy…</p>
        </div>
      </div>
    </main>

    <footer class="site-footer">
      <div class="container footer-inner">
        <span>© 2026 OpenTomato. MIT licensed.</span>
        <div class="footer-links">
          <a href="app.html">Demo</a>
          <a href="privacy.html">Privacy Policy</a>
          <a href="https://github.com/cksarge/OpenTomato" target="_blank" rel="noopener">GitHub</a>
          <a href="mailto:carterkcoding@gmail.com">Contact</a>
        </div>
      </div>
    </footer>

    <script>
      // Serves a specific version's policy when the URL names one
      // (privacy.html#1.1.0 -> privacy-policy-1-1-0.md), regardless of which
      // version is currently live. With no #version, falls back to
      // OPENTOMATO_PRIVACY_VERSION from assets/config.js — the version that's
      // actually live right now. Every version stays reachable at its own
      // #-URL forever, even after a newer one becomes the default.
      const contentEl = document.getElementById("policy-content");

      function versionToFile(version) {
        return "privacy-policy-" + version.replace(/\./g, "-") + ".md";
      }

      const isValidVersion = (v) => /^[0-9]+(\.[0-9]+){1,3}$/.test(v);

      function loadPolicy() {
        const requested = decodeURIComponent(location.hash.slice(1)).trim();
        const version = isValidVersion(requested) ? requested : window.OPENTOMATO_PRIVACY_VERSION;
        const file = version ? versionToFile(version) : null;

        if (!file) {
          contentEl.innerHTML =
            '<p class="policy-error">No privacy policy version is configured. Set ' +
            "<code>OPENTOMATO_PRIVACY_VERSION</code> in <code>assets/config.js</code>.</p>";
          return;
        }

        contentEl.innerHTML = '<p class="policy-loading">Loading privacy policy…</p>';
        fetch(file)
          .then((res) => {
            if (!res.ok) throw new Error("Failed to load " + file);
            return res.text();
          })
          .then((markdown) => {
            contentEl.innerHTML = marked.parse(markdown);
          })
          .catch(() => {
            contentEl.innerHTML =
              '<p class="policy-error">Couldn\'t load the privacy policy (' +
              file +
              "). If you're viewing this file directly from disk, serve the <code>website/</code> folder " +
              "over http(s) instead (e.g. <code>python3 -m http.server</code>) — browsers block local file " +
              "fetches. If you followed a #version link, that version may not exist.</p>";
          });
      }

      loadPolicy();
      // Re-render if just the #version changes without a full page load
      // (e.g. editing the hash while already on the page).
      window.addEventListener("hashchange", loadPolicy);
    </script>
  </body>
</html>
