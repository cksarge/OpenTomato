<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title data-i18n="popup_appName">OpenTomato</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="popup">
      <header class="popup-header">
        <div class="brand">
          <img src="../icons/icon32.png" alt="" class="brand-icon" width="20" height="20" />
          <span class="brand-name" data-i18n="popup_appName">OpenTomato</span>
        </div>
        <div class="header-actions">
          <button id="theme-toggle-btn" class="icon-btn" data-i18n-title="common_toggleTheme" data-i18n-aria-label="common_toggleTheme" title="Toggle theme" aria-label="Toggle theme"></button>
          <button id="settings-btn" class="icon-btn" data-i18n-title="popup_settingsTitle" data-i18n-aria-label="popup_settingsAriaLabel" title="Settings" aria-label="Open settings">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
              <path
                fill="currentColor"
                d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Zm7.4-3.5c0 .3 0 .6-.05.9l1.9 1.5a.5.5 0 0 1 .12.63l-1.8 3.1a.5.5 0 0 1-.6.22l-2.24-.9c-.47.36-.98.66-1.54.89l-.34 2.38a.5.5 0 0 1-.5.43h-3.6a.5.5 0 0 1-.5-.43l-.34-2.38a6.9 6.9 0 0 1-1.54-.89l-2.24.9a.5.5 0 0 1-.6-.22l-1.8-3.1a.5.5 0 0 1 .12-.63l1.9-1.5A6.9 6.9 0 0 1 4.6 12c0-.3.02-.6.06-.9l-1.9-1.5a.5.5 0 0 1-.12-.63l1.8-3.1a.5.5 0 0 1 .6-.22l2.24.9c.47-.36.98-.66 1.54-.89l.34-2.38a.5.5 0 0 1 .5-.43h3.6a.5.5 0 0 1 .5.43l.34 2.38c.56.23 1.07.53 1.54.89l2.24-.9a.5.5 0 0 1 .6.22l1.8 3.1a.5.5 0 0 1-.12.63l-1.9 1.5c.04.3.06.6.06.9Z"
              />
            </svg>
          </button>
        </div>
      </header>

      <div class="preset-bar" id="preset-bar" hidden>
        <select id="preset-select" data-i18n-aria-label="popup_presetSelectAriaLabel" aria-label="Apply a duration preset">
          <option value="" selected disabled data-i18n="popup_presetSelectPlaceholder">Duration preset…</option>
        </select>
      </div>

      <main class="timer-card" id="timer-card" data-phase="work">
        <p class="phase-label" id="phase-label" data-i18n="common_phaseWork">Focus</p>
        <div class="ring-wrap">
          <svg class="ring" viewBox="0 0 120 120">
            <circle class="ring-track" cx="60" cy="60" r="54" />
            <circle class="ring-progress" id="ring-progress" cx="60" cy="60" r="54" />
          </svg>
          <div class="time-display" id="time-display">25:00</div>
        </div>
        <div class="cycle-dots" id="cycle-dots" aria-hidden="true"></div>
      </main>

      <div class="controls">
        <button id="primary-btn" class="btn btn-primary" data-i18n="common_start">Start</button>
        <div class="secondary-controls">
          <button id="skip-btn" class="btn btn-ghost" data-i18n="common_skip" disabled>Skip</button>
          <button id="reset-btn" class="btn btn-ghost" data-i18n="common_reset" disabled>Reset</button>
        </div>
      </div>

      <p class="restrict-note" id="restrict-note" data-i18n="common_restrictNote" hidden>
        🔒 Restrictive mode — no skipping; reset only while paused.
      </p>
      <p class="focus-stat" id="focus-stat" aria-live="polite"></p>

      <div class="tasks" id="tasks" hidden>
        <ul class="task-list" id="task-list"></ul>
        <button type="button" class="task-toggle" id="task-toggle" hidden>Show all</button>
      </div>

      <div class="reset-confirm" id="reset-confirm" hidden>
        <p data-i18n="common_resetConfirmPrompt">Restrictive mode is on. To reset the timer, type this exactly:</p>
        <p class="reset-phrase" id="reset-phrase" data-i18n="common_resetConfirmPhrase">Yes, I want to reset the timer.</p>
        <input
          type="text"
          id="reset-confirm-input"
          data-i18n-placeholder="common_resetConfirmPlaceholder"
          placeholder="Type the phrase"
          autocomplete="off"
          autocapitalize="off"
          spellcheck="false"
        />
        <div class="reset-confirm-actions">
          <button type="button" id="reset-confirm-cancel" class="btn btn-ghost" data-i18n="common_cancel">Cancel</button>
          <button type="button" id="reset-confirm-go" class="btn btn-primary" data-i18n="common_resetTimer" disabled>Reset timer</button>
        </div>
      </div>
    </div>
    <script type="module" src="popup.js"></script>
  </body>
</html>
